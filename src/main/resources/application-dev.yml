# Local development overrides. Activate with SPRING_PROFILES_ACTIVE=dev.
# Never use this profile in a deployed environment.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:movie-ticket-booking-app-db}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.example.movieticketbookingsystem: DEBUG
