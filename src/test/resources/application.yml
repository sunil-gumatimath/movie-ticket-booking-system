spring:
  datasource:
    url: jdbc:h2:mem:moviedb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  cors:
    allowed-origins: http://localhost:3000

jwt:
  expiration: 86400000
